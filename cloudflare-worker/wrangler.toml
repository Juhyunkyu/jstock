name = "alpha-cycle-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Secrets (set via `wrangler secret put <NAME>`):
#   FINNHUB_API_KEY
#   DEEPL_API_KEY
#   FRED_API_KEY
#   TWELVE_DATA_API_KEY
#   FMP_API_KEY
#   MARKETAUX_API_KEY
#   APP_TOKEN          — optional, enables X-App-Token header auth
#   VAPID_PUBLIC_KEY   — Web Push VAPID public key
#   VAPID_PRIVATE_KEY  — Web Push VAPID private key (never expose to client)
#   VAPID_SUBJECT      — Web Push VAPID subject (mailto:email)

[[kv_namespaces]]
binding = "CACHE_KV"
id = "ff16e8ed00024a5b9bce15eaf280aa5b"

[triggers]
crons = [
  "0 13 * * 1-5",
  "0 22 * * 1-5",
  "0 12 * * SUN",
  "*/2 14-20 * * 1-5",
]
